<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound Chase Cards</title>
<style>
  :root { --cols: 4; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; padding: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar select, .bar input { background: #1d1d1d; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; font: inherit; }
  .bar input[type="number"] { width: 90px; }
  #status { color: #999; }
  #grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 12px; }
  .card { display: block; color: inherit; text-decoration: none; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 5/7; object-fit: contain; background: #000; display: block; }
  .card .info { padding: 8px; }
  .card .name { font-weight: 600; }
  .card .set { color: #999; font-size: 12px; }
  .card .price { color: #6fdc8c; font-weight: 700; margin-top: 2px; }
  #more { margin: 16px auto; display: block; background: #1d1d1d; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 20px; font: inherit; cursor: pointer; }
  #more[hidden] { display: none; }
</style>
</head>
<body>
<div class="bar">
  <select id="set"><option value="">All sets</option></select>
  <input id="min" type="number" min="0" step="1" placeholder="Min $">
  <input id="max" type="number" min="0" step="1" placeholder="Max $">
  <label>Columns
    <select id="cols">
      <option>2</option><option>3</option><option selected>4</option>
      <option>5</option><option>6</option><option>7</option><option>8</option>
    </select>
  </label>
  <span id="status"></span>
</div>
<div id="grid"></div>
<button id="more" hidden>Load more</button>

<script>
const PAGE = 48;
const $ = id => document.getElementById(id);
let all = [], filtered = [], shown = 0;

function apply() {
  const set = $('set').value;
  const min = parseFloat($('min').value), max = parseFloat($('max').value);
  filtered = all.filter(c =>
    (!set || c.set === set) &&
    (isNaN(min) || (c.price != null && c.price >= min)) &&
    (isNaN(max) || (c.price != null && c.price <= max))
  );
  shown = 0;
  $('grid').innerHTML = '';
  renderMore();
}

function renderMore() {
  const frag = document.createDocumentFragment();
  filtered.slice(shown, shown + PAGE).forEach(c => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'https://www.tcgplayer.com/product/' + c.id;
    a.target = '_blank';
    a.rel = 'noopener';
    const price = c.price != null ? '$' + c.price.toFixed(2) : '—';
    a.innerHTML = `
      <img loading="lazy" src="https://tcgplayer-cdn.tcgplayer.com/product/${c.id}_in_400x400.jpg" alt="">
      <div class="info">
        <div class="name"></div>
        <div class="set"></div>
        <div class="price">${price}</div>
      </div>`;
    a.querySelector('.name').textContent = c.name;
    a.querySelector('.set').textContent = c.set;
    frag.appendChild(a);
  });
  $('grid').appendChild(frag);
  shown = Math.min(shown + PAGE, filtered.length);
  $('status').textContent = `${shown} / ${filtered.length} cards`;
  $('more').hidden = shown >= filtered.length;
}

async function init() {
  $('status').textContent = 'Loading…';
  try {
    const res = await fetch('cards.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    all = data.cards.sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
    [...new Set(all.map(c => c.set).filter(Boolean))].sort().forEach(s => {
      const o = document.createElement('option');
      o.value = o.textContent = s;
      $('set').appendChild(o);
    });
    document.title += ' — prices ' + new Date(data.updated).toLocaleString();
    apply();
  } catch (e) {
    $('status').textContent = 'Error loading cards.json: ' + e.message;
  }
}

['set', 'min', 'max'].forEach(id => $(id).addEventListener('change', apply));
$('cols').addEventListener('change', e => document.documentElement.style.setProperty('--cols', e.target.value));
$('more').addEventListener('click', renderMore);
init();
</script>
</body>
</html>
